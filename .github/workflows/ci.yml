name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017/ci_dummy
      NEXTAUTH_SECRET: ci-dummy-secret-ci-dummy-secret-0000
      NEXTAUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      REQUIRE_EMAIL_VERIFICATION: "false"
      TRUST_PROXY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
