# nginx untuk Forechek -> /etc/nginx/sites-available/forechek.conf (symlink ke sites-enabled), lalu: nginx -t && systemctl reload nginx
# Pasang berkas ini SETELAH sertifikat terbit (bootstrap: deploy/nginx/forechek-http-only.conf + certbot certonly --webroot).
limit_req_zone $binary_remote_addr zone=forechek_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=forechek_api:10m rate=30r/s;

upstream forechek_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name forechek.ailo.ai.id;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forechek.ailo.ai.id;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/forechek.ailo.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forechek.ailo.ai.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:forechek_ssl:10m;

    # HSTS dipasang di sini; header yang sama dari aplikasi disembunyikan agar tidak ganda.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    proxy_hide_header Strict-Transport-Security;

    # Naskah maks. 1 MB; badan JSON maks. 2,5 MB (escape). Sedikit di atas itu.
    client_max_body_size 3m;
    client_body_timeout 30s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Host asli WAJIB diteruskan (pemeriksaan Origin dan redirect login memakainya). X-Forwarded-For: aplikasi memakai entri TERAKHIR
    # (ditambahkan nginx) bila TRUST_PROXY=true dan TRUST_PROXY_HOPS=1.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Aset statis berhash: cache panjang.
    location /_next/static/ {
        proxy_pass http://forechek_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SSE chat: tanpa buffering dan tanpa gzip; timeout baca panjang (giliran agen hingga beberapa menit).
    location ~ ^/api/projects/[^/]+/chat$ {
        proxy_pass http://forechek_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        add_header X-Accel-Buffering no always;
        limit_req zone=forechek_api burst=20 nodelay;
    }

    # Endpoint autentikasi: lapisan batas laju tambahan di depan batas laju aplikasi.
    location /api/auth/ {
        proxy_pass http://forechek_app;
        limit_req zone=forechek_auth burst=20 nodelay;
    }

    location /api/ {
        proxy_pass http://forechek_app;
        proxy_read_timeout 120s;
        limit_req zone=forechek_api burst=60 nodelay;
    }

    location / {
        proxy_pass http://forechek_app;
        proxy_read_timeout 60s;
    }
}
