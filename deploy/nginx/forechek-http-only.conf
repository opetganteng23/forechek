# nginx BOOTSTRAP (hanya port 80) untuk server kosong yang belum punya sertifikat. Dipakai SEBELUM forechek.conf:
#   1) pasang berkas ini  2) certbot certonly --webroot -w /var/www/certbot -d forechek.ailo.ai.id
#   3) ganti ke forechek.conf  4) nginx -t && systemctl reload nginx
# Tanpa redirect ke HTTPS (belum ada listener 443). Jangan dibiarkan aktif setelah sertifikat terbit.
server {
    listen 80;
    listen [::]:80;
    server_name forechek.ailo.ai.id;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
